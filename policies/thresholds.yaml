# Confidence cutoffs per decision (PLAN.md section 8). Tune from eval data, not by feel.
triage:
  category_min_confidence: 0.75   # below -> human queue
  path_min_confidence: 0.6        # below -> human queue (unsure what resolving needs)
  abusive_escalate_at: 0.6        # is_abusive noul >= this -> human queue
  # path == "human" always goes to the human queue (not configurable).
route_model:
  min_confidence: 0.6             # below -> default_tier
  default_tier: strong
